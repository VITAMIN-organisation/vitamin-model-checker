site_name: VITAMIN Model Checker
site_description: Core library for model checking multi-agent systems

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
    - scheme: slate
      primary: indigo
      accent: indigo

markdown_extensions:
  - pymdownx.highlight:
      auto_title: true

plugins:
  - search
  - autorefs
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            show_source: true

nav:
  - Home: index.md
  - VITAMIN Stack: vitamin-stack.md
  - Contributing: contributing.md
  - Deployment Ports: deployment-ports.md
  - Architecture: architecture.md
  - File Formats: file_formats.md
  - Logic Knowledge Base: logic_knowledge_base.md
  - Algorithm Structure: algorithm_structure.md
  - Algorithm Design: algorithm_design.md
  - Logic Algorithms:
    - CTL: CTL/algorithm.md
    - LTL: LTL/algorithm.md
    - ATL: ATL/algorithm.md
    - ATLF: ATLF/algorithm.md
    - NatATL: NatATL/algorithm.md
    - NatATLF: NatATLF/algorithm.md
    - NatSL:
      - Algorithm: NatSL/algorithm.md
      - Semantics: NatSL/semantics.md
      - Experiments: NatSL/experiments.md
      - Logistics robot: NatSL/logistics_robot.md
    - OATL: OATL/algorithm.md
    - OL: OL/algorithm.md
    - RBATL: RBATL/algorithm.md
    - RABATL: RABATL/algorithm.md
    - CapATL: CapATL/algorithm.md
    - COTL: COTL/algorithm.md
    - Wallet_ATL: Wallet_ATL/algorithm.md
    - ICTL: ICTL/algorithm.md
    - IATL: IATL/algorithm.md
    - TCTL: TCTL/algorithm.md
    - TOL: TOL/algorithm.md
  - Wallet ATL: Wallet_ATL/usage.md
  - Adding a New Logic: adding_a_new_logic.md
  - API Reference:
    - Overview: api/overview.md
    - Root: api/model_checker.md
    - Algorithms: api/model_checker.algorithms.md
    - Parsers: api/model_checker.parsers.md
