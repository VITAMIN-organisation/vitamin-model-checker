site_name: VITAMIN Model Checker
site_description: Core library for model checking multi-agent systems

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
    - scheme: slate
      primary: indigo
      accent: indigo

markdown_extensions:
  - pymdownx.highlight:
      auto_title: true

plugins:
  - search
  - autorefs
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            show_source: true

nav:
  - Algorithms:
    - Algorithm design: algorithms/index.md
    - CTL: algorithms/ctl.md
    - LTL: algorithms/ltl.md
    - ATL: algorithms/atl.md
    - ATLF: algorithms/atlf.md
    - ATL_STAR: algorithms/atl_star.md
    - NatATL: algorithms/natatl.md
    - NatATLF: algorithms/natatlf.md
    - NatSL: algorithms/natsl.md
    - OATL: algorithms/oatl.md
    - OL: algorithms/ol.md
    - RBATL: algorithms/rbatl.md
    - RABATL: algorithms/rabatl.md
    - CapATL: algorithms/capatl.md
    - COTL: algorithms/cotl.md
    - Wallet_ATL: algorithms/wallet_atl.md
    - ICTL: algorithms/ictl.md
    - IATL: algorithms/iatl.md
    - TCTL: algorithms/tctl.md
    - TOL: algorithms/tol.md
  - Reference:
    - Logic knowledge base: reference/logic_knowledge_base.md
    - File formats: reference/file_formats.md
  - Guides:
    - Architecture: guides/architecture.md
    - Deployment ports: guides/deployment-ports.md
  - Examples:
    - NatSL experiments: examples/natsl_experiments.md
    - NatSL logistics robot: examples/natsl_logistics_robot.md
    - Wallet ATL usage: examples/wallet_atl_usage.md
  - API Reference:
    - Overview: api/overview.md
    - Root: api/model_checker.md
    - Algorithms: api/model_checker.algorithms.md
    - Parsers: api/model_checker.parsers.md
